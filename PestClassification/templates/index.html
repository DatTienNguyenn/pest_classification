<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Pest classification system</title>
    <link rel="stylesheet" type="text/css" href="/static/styles/style.css">
    <script src="https://code.jquery.com/jquery-3.6.1.js" integrity="sha256-3zlB5s2uwoUzrXK3BT7AX3FyvojsraNFxCc2vC/7pNI="
        crossorigin="anonymous"></script>
</head>
<body>
    <div class="header">
        Pest classification system
    </div>

    <div class="content">
        <div class="upload">
            <button class="btn-upload" id="btn-upload">Choose file has insect to analyze </button>
            <div class="hint" id="hint">Supported format: PNG, JPG và JPEG.</div>
            <form action="/" method="POST" id="form" enctype="multipart/form-data">
                <input type="file" id="input" accept="image/*" name="file" hidden>
            </form>
        </div>
        <div class="result">
            {% if msg %}
            <div class="result_title">Analyze by model: VGG16</div>
            <div class="result_text">{{ msg }}</div>
            <div class="result_text">
                Pest specify : 
                <span class="result_predict">{{ predict_name }}</span>
            </div>
            <div class="more">{{ more }}</div>
            {% if image %}
            <img class="result_image" src="test/files/{{ image }}" alt="">
            {% endif %}
            {% endif %}
        </div>
    </div>

</body>
<script>
    $("#btn-upload").click(() => {
      $("#input").trigger("click");
    });

    $("#input").change(() => {
      $("#form").submit();
      $("#hint").text("File uploading..." + $("#input")[0].files[0].name)
    });
</script>
</html>
